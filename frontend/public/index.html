<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1E3A5F" />
    <meta
      name="description"
      content="Supply & Production ERP with Dual-AI OCR Document Extraction"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.svg" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Content-Security-Policy (meta). Achado 15.

      O app Electron empacotado e servido por `file://`, e nesse caso o header
      HTTP montado em public/electron.js (session.webRequest.onHeadersReceived)
      NUNCA roda: os hooks de webRequest so veem requisicoes http(s). Logo, na
      app empacotada esta <meta> e a UNICA politica que vale, e e ela que fecha
      a superficie de XSS que ficava aberta.

      Onde meta e header valem ao mesmo tempo (o dev server, documento http(s),
      unico caso que chega ao onHeadersReceived), o navegador aplica a
      INTERSECCAO das duas: o `connect-src` mais restrito do header vence.

      `script-src`/`object-src`/`base-uri`/`frame-ancestors` seguem ESTRITOS —
      e onde mora a protecao contra XSS: script/objeto/base injetado, ou pagina
      enquadrada, nao tem por onde entrar. `frame-ancestors` fica por paridade
      com o header mesmo o Chromium ignorando a diretiva em <meta> (ele apenas
      registra isso, sem bloquear nada); quem a aplica de fato e o header, no
      caso http(s). No `file://` ela e inofensiva — uma pagina local nao e
      enquadravel por conteudo remoto.

      `connect-src` e PROPOSITALMENTE PERMISSIVO: 'self' (os proprios assets do
      app), qualquer origem https e qualquer porta em http localhost. Ele NAO
      pode ser preso a URL de build — era exatamente o bug antigo: o preload
      injeta um override de origem em runtime (window.__ERP_API_BASE_URL__,
      vindo de REACT_APP_API_BASE_URL/ERP_API_BASE_URL) para apontar um build
      empacotado a outro backend sem recompilar, e uma meta congelada bloquearia
      isso em silencio. 'self' tambem cobre os assets `file://` e o websocket de
      HMR do dev server (ws://localhost:3000 casa com 'self' quando a pagina e
      http://localhost:3000).

      `style-src`/`font-src` abrem so as origens do Google Fonts que o app
      realmente usa: src/index.css faz `@import` da Inter em
      fonts.googleapis.com e o CSS resultante baixa os arquivos de
      fonts.gstatic.com. Sem elas, o import e bloqueado e o app cai para
      sans-serif — os assets do proprio app tem que carregar.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: http://localhost:*; object-src 'none'; base-uri 'self'; frame-ancestors 'none';"
    />
    <meta
      name="erp-api-base-url"
      content="%REACT_APP_API_BASE_URL%"
    />
    <!--
      erp-api-base-url acima e um <meta name> comum, NAO um http-equiv de
      Content-Security-Policy: e lido por public/electron.js (readBuildTimeOrigins)
      para montar o `connect-src` do header http(s) e nao tem poder de politica.
      Precisa ser <meta> e nao comentario porque o build de producao remove os
      comentarios do index.html (html-minifier), e o valor de build se perderia.
    -->
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Supply &amp; Production ERP — AI OCR</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    -->
  </body>
</html>
