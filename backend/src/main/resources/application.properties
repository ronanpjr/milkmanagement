spring.application.name=erp-ai-ocr-backend

# PostgreSQL Datasource Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/erp_ocr_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (schema is managed by Flyway migrations)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Silence Hibernate SQL logs
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF

# JWT Security
api.security.token.secret=${JWT_SECRET}
api.security.token.expiration=3600000
api.security.refresh-token.expiration=604800000

# CORS
api.security.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Reverse-proxy forwarded headers (only trust internal Docker/private ranges)
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=172.16.0.0/12,10.0.0.0/8,192.168.0.0/16

# Springdoc / OpenAPI
springdoc.api-docs.info.title=ERP AI OCR API
springdoc.api-docs.info.description=Supply & Production ERP REST API with Dual-AI OCR Document Extraction.
springdoc.api-docs.info.version=v1.0.0
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}

# Azure Document Intelligence
azure.document-intelligence.endpoint=${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:https://undefined.cognitiveservices.azure.com/}
azure.document-intelligence.key=${AZURE_DOCUMENT_INTELLIGENCE_KEY:undefined}

# Google Gemini via Vertex AI (Application Default Credentials)
gemini.vertex.project-id=${GEMINI_PROJECT_ID:${GOOGLE_CLOUD_PROJECT:}}
gemini.vertex.location=${GEMINI_LOCATION:global}
gemini.vertex.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.vertex.fallback-models=${GEMINI_FALLBACK_MODELS:gemini-2.0-flash}
gemini.vertex.max-pdf-pages=${GEMINI_MAX_PDF_PAGES:20}
gemini.vertex.connect-timeout-ms=${GEMINI_CONNECT_TIMEOUT_MS:10000}
gemini.vertex.read-timeout-ms=${GEMINI_READ_TIMEOUT_MS:60000}
gemini.vertex.retry.max-attempts=${GEMINI_RETRY_MAX_ATTEMPTS:3}
gemini.vertex.retry.initial-delay-ms=${GEMINI_RETRY_INITIAL_DELAY_MS:500}
gemini.vertex.retry.multiplier=${GEMINI_RETRY_MULTIPLIER:2.0}

# Actuator / Observability
management.server.port=${MANAGEMENT_PORT:8081}
management.server.address=0.0.0.0
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=false
management.metrics.tags.application=erp-ai-ocr

# OCR Service Default
ocr.service.default=${OCR_SERVICE_DEFAULT:gemini}

# Daily OCR Quota per User
ocr.quota.daily=${OCR_DAILY_QUOTA:50}
ocr.quota.zone=${OCR_QUOTA_ZONE:UTC}

# Fixed-window Rate Limiting
api.rate.ocr.limit=${OCR_RATE_LIMIT:12}
api.rate.ocr.window-minutes=${OCR_RATE_WINDOW_MINUTES:60}
api.rate.batch.limit=${COLLECTIONS_BATCH_RATE_LIMIT:120}
api.rate.batch.window-minutes=${COLLECTIONS_BATCH_RATE_WINDOW_MINUTES:60}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
