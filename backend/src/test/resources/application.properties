spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

spring.flyway.enabled=false
api.security.token.secret=my-super-secret-key-for-testing-purposes-only-1234567890
api.security.token.expiration=3600
admin.initial-password=test-admin-password-not-for-prod

management.server.port=8080
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=false
management.metrics.tags.application=erp-ai-ocr
